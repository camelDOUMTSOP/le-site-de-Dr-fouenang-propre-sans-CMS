backend:
  name: github
  repo: camelDOUMTSOP/le-site-de-Dr-fouenang-propre-sans-CMS
  branch: main
  # Service de connexion GitHub (Cloudflare Worker "sveltia-cms-auth")
  # dédié au site Fouenang. A remplacer par l'adresse réelle du Worker.
  base_url: https://REMPLACER-PAR-LE-WORKER.workers.dev
  commit_messages:
    create: 'Ajoute {{collection}} « {{slug}} »'
    update: 'Modifie {{collection}} « {{slug}} »'
    delete: 'Supprime {{collection}} « {{slug}} »'
    uploadMedia: 'Ajoute l’image « {{path}} »'
    deleteMedia: 'Supprime l’image « {{path}} »'

locale: 'fr'

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Articles de Blog"
    label_singular: "Article"
    folder: "_posts/blog"
    create: true
    slug: "{{slug}}"
    sortable_fields: ['date', 'title']
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        hint: "Date dans le futur = article programmé : il apparaîtra tout seul sur le site à cette date et heure."
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Catégorie (ex : Prévention, Conseil, Urgence)", name: "tag", widget: "string" }
      - { label: "Résumé (1 à 2 phrases)", name: "desc", widget: "text" }
      - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "flyers"
    label: "Flyers & Promotions"
    label_singular: "Flyer"
    folder: "_posts/flyers"
    create: true
    slug: "{{slug}}"
    sortable_fields: ['date', 'title']
    fields:
      - { label: "Nom du flyer (ex : Flyer Juin)", name: "title", widget: "string" }
      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        hint: "Laissez la date du jour pour publier tout de suite. Date dans le futur = flyer programmé."
      - { label: "Image du flyer", name: "image", widget: "image" }
