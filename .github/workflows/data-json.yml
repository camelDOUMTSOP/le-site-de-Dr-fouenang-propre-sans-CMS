name: Régénère data.json

# Chaque fois qu'un article ou un flyer est publié/modifié via /admin,
# data.json est reconstruit et renvoyé sur main. Cloudflare redéploie ensuite.
on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
      - 'build.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-json
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - name: Enregistre data.json s'il a changé
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json déjà à jour"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Régénère data.json"
          git pull --rebase origin main
          git push origin HEAD:main
